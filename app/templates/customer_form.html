{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Edit' if customer else 'New' }} Customer</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ customer.name if customer else '' }}" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Phone (E.164 e.g. +123456789)</label>
    <input name="phone" class="form-control" value="{{ customer.phone if customer else '' }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control">{{ customer.notes if customer else '' }}</textarea>
  </div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="{{ url_for('routes.customers_list') }}">Cancel</a>
</form>
{% endblock %}
