{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Edit' if service else 'New' }} Service</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Name</label>
    <input name="name" class="form-control" value="{{ service.name if service else '' }}" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Duration (minutes)</label>
    <input name="duration" type="number" min="5" step="5" class="form-control" value="{{ service.duration_minutes if service else 60 }}" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Price</label>
    <input name="price" type="number" min="0" step="0.01" class="form-control" value="{{ service.price if service else 0 }}" required />
  </div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="{{ url_for('routes.services_list') }}">Cancel</a>
</form>
{% endblock %}
