{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Customers</h3>
  <a href="{{ url_for('routes.new_customer') }}" class="btn btn-primary">New Customer</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Phone</th>
      <th>Notes</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for c in customers %}
    <tr>
      <td>{{ c.name }}</td>
      <td>{{ c.phone or '-' }}</td>
      <td>{{ c.notes or '' }}</td>
      <td>
        <a class="btn btn-sm btn-outline-secondary" href="{{ url_for('routes.edit_customer', customer_id=c.id) }}">Edit</a>
        <form method="post" action="{{ url_for('routes.delete_customer', customer_id=c.id) }}" class="d-inline" onsubmit="return confirm('Delete customer?');">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
