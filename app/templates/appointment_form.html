{% extends 'base.html' %}
{% block content %}
<h3>{{ 'Edit' if appointment else 'New' }} Appointment</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Customer</label>
    <select name="customer_id" class="form-select" required>
      {% for c in customers %}
      <option value="{{ c.id }}" {% if appointment and appointment.customer_id == c.id %}selected{% endif %}>{{ c.name }} ({{ c.phone or 'no phone' }})</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Service</label>
    <select name="service_id" class="form-select" required>
      {% for s in services %}
      <option value="{{ s.id }}" {% if appointment and appointment.service_id == s.id %}selected{% endif %}>{{ s.name }} ({{ s.duration_minutes }} min)</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Start (YYYY-MM-DD HH:MM)</label>
    <input name="start_datetime" class="form-control" value="{{ appointment.start_datetime.strftime('%Y-%m-%d %H:%M') if appointment else '' }}" placeholder="2025-08-10 14:00" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Status</label>
    <select name="status" class="form-select">
      {% for s in ['booked','completed','cancelled','no_show'] %}
      <option value="{{ s }}" {% if appointment and appointment.status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Price Override (optional)</label>
    <input name="price_override" type="number" min="0" step="0.01" class="form-control" value="{{ appointment.price_override if appointment and appointment.price_override is not none else '' }}" />
  </div>
  <div class="mb-3">
    <label class="form-label">Notes</label>
    <textarea name="notes" class="form-control">{{ appointment.notes if appointment else '' }}</textarea>
  </div>
  <button class="btn btn-primary">Save</button>
  <a class="btn btn-secondary" href="{{ url_for('routes.appointments_list') }}">Cancel</a>
</form>
{% endblock %}
